<body>

<div id="root">
  <div class="loading">
    <div class="spinner"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://olivaregvcejjghrjdio.supabase.co";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9saXZhcmVndmNlampnaHJqZGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyODE4MzUsImV4cCI6MjEwNTg1NzgzNX0.r1aukPMLnShXSFjuE47AIaGKmgwHrFuaWl8-2r8Su0Y";

const AI_URL = "https://olivaregvcejjghrjdio.supabase.co/functions/v1/track-circle-a";

const MEDIA_BUCKET = "track-circle-media";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const state = {
  session:null,
  user:null,
  profile:null,
  tab:"home",
  posts:[],
  comments:{},
  liked:new Set(),
  following:new Set(),
  circles:[],
  messages:[],
  profiles:[],
  aiHistory:[],
  swipeStart:null,
  stats:{
    posts:0,
    followers:0,
    following:0,
    circles:0
  }
};

function esc(v=""){
  return String(v).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[m])
  );
}

function toast(msg){
  const el=document.getElementById("toast");

  el.textContent=msg;
  el.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast=setTimeout(
    ()=>el.classList.remove("show"),
    3200
  );
}

function initials(p){
  return esc(
    (
      p?.display_name ||
      p?.username ||
      "TC"
    )
    .trim()
    .split(/\s+/)
    .map(x=>x[0])
    .slice(0,2)
    .join("")
    .toUpperCase() || "TC"
  );
}

function avatar(p,cls="avatar"){
  if(p?.avatar_url){
    return `
      <img
        class="${cls}"
        src="${esc(p.avatar_url)}"
        alt=""
      >
    `;
  }

  return `
    <div class="${cls}">
      ${initials(p)}
    </div>
  `;
}

function fmtDate(d){
  try{
    return new Intl.DateTimeFormat(
      undefined,
      {
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    ).format(new Date(d));
  }catch{
    return "";
  }
}

function errText(e){
  return e?.message ||
         e?.error_description ||
         "Something went wrong.";
}

function setRoot(html){
  document.getElementById("root").innerHTML=html;
}

function currentName(){
  return state.profile?.display_name ||
         state.profile?.username ||
         state.user?.email?.split("@")[0] ||
         "there";
}

async function boot(){

  if(!window.supabase){
    renderFatal(
      "Supabase client failed to load. Check your internet connection and redeploy."
    );
    return;
  }

  const {
    data:{session},
    error:sessionError
  } = await sb.auth.getSession();

  if(sessionError){
    renderFatal(
      "Supabase session error: " +
      errText(sessionError)
    );
    return;
  }

  state.session=session;
  state.user=session?.user || null;

  if(!state.user){
    renderAuth();
    return;
  }

  await ensureProfile();
  await loadData();

  renderApp();

  sb.auth.onAuthStateChange(
    async(_e,s)=>{
      state.session=s;
      state.user=s?.user || null;

      if(!s){
        renderAuth();
      }
    }
  );
}

function renderFatal(message){

  setRoot(`
    <main class="auth">
      <section class="authbox">

        <div class="authlogo">TC</div>

        <h1>Track Circle</h1>

        <p class="sub">
          Startup problem
        </p>

        <div
          class="card"
          style="padding:16px;color:#ffabb9;line-height:1.5"
        >
          ${esc(message)}
        </div>

        <button
          class="btn"
          style="width:100%;margin-top:14px"
          onclick="location.reload()"
        >
          Reload Track Circle
        </button>

      </section>
    </main>
  `);
}

async function ensureProfile(){

  if(!state.user){
    return;
  }

  const {
    data,
    error
  } = await sb
    .from("profiles")
    .select("*")
    .eq("id",state.user.id)
    .maybeSingle();

  if(error){

    console.error(error);

    toast(
      "Profiles access is blocked by RLS. Run the SQL patch below."
    );

    return;
  }

  if(data){
    state.profile=data;
    return;
  }

  const base=(
    state.user.user_metadata?.display_name ||
    state.user.email?.split("@")[0] ||
    "Track Circle User"
  ).trim();

  const username=(
    state.user.user_metadata?.username ||
    base
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"")
      .slice(0,24) ||
    ("user"+Date.now().toString().slice(-5))
  );

  const {
    data:created,
    error:e
  } = await sb
    .from("profiles")
    .insert({
      id:state.user.id,
      display_name:base,
      username
    })
    .select("*")
    .single();

  if(e){
    toast(
      "Could not create your profile: " +
      errText(e)
    );

    return;
  }

  state.profile=created;
}

async function loadData(){

  await Promise.allSettled([
    loadPosts(),
    loadFollowing(),
    loadCircles(),
    loadProfiles()
  ]);

  await loadStats();
}

async function loadProfiles(){

  const {data}=await sb
    .from("profiles")
    .select("*")
    .order("display_name")
    .limit(100);

  state.profiles=data || [];
}

async function loadPosts(){

  const {
    data,
    error
  } = await sb
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){

    console.error(error);

    state.posts=[];

    return;
  }

  state.posts=data || [];

  const ids=state.posts.map(p=>p.id);

  if(!ids.length){
    return;
  }

  const {data:likes}=await sb
    .from("post_likes")
    .select("post_id,user_id")
    .in("post_id",ids);

  state.liked=new Set(
    (likes || [])
      .filter(x=>x.user_id===state.user.id)
      .map(x=>x.post_id)
  );
}

async function loadFollowing(){

  const {data}=await sb
    .from("follows")
    .select("following_id")
    .eq("follower_id",state.user.id);

  state.following=new Set(
    (data || []).map(x=>x.following_id)
  );
}

async function loadCircles(){

  const {data:members}=await sb
    .from("circle_members")
    .select("circle_id,role")
    .eq("user_id",state.user.id);

  const ids=(members || []).map(
    x=>x.circle_id
  );

  if(!ids.length){
    state.circles=[];
    return;
  }

  const {data}=await sb
    .from("circles")
    .select("*")
    .in("id",ids)
    .order("created_at",{ascending:false});

  state.circles=data || [];
}

async function loadStats(){

  const [
    posts,
    followers,
    following,
    circles
  ] = await Promise.all([

    sb
      .from("posts")
      .select("id",{count:"exact",head:true})
      .eq("user_id",state.user.id),

    sb
      .from("follows")
      .select("id",{count:"exact",head:true})
      .eq("following_id",state.user.id),

    sb
      .from("follows")
      .select("id",{count:"exact",head:true})
      .eq("follower_id",state.user.id),

    sb
      .from("circle_members")
      .select("circle_id",{count:"exact",head:true})
      .eq("user_id",state.user.id)

  ]);

  state.stats={
    posts:posts.count || 0,
    followers:followers.count || 0,
    following:following.count || 0,
    circles:circles.count || 0
  };
}

async function submitAuth(mode){

  const email=
    document.getElementById("authEmail")
      ?.value.trim();

  const password=
    document.getElementById("authPassword")
      ?.value;

  if(!email || !password){
    return toast(
      "Enter your email and password."
    );
  }

  const btn=
    document.querySelector(
      ".authbox .btn:last-child"
    );

  if(btn){
    btn.disabled=true;
    btn.textContent="Connecting…";
  }

  try{

    if(mode==="signup"){

      const name=
        document.getElementById("authName")
          ?.value.trim() ||
        email.split("@")[0];

      const username=(
        document.getElementById("authUsername")
          ?.value.trim() ||
        name
      )
        .toLowerCase()
        .replace(/[^a-z0-9_]/g,"")
        .slice(0,24);

      const {
        data,
        error
      } = await sb.auth.signUp({
        email,
        password,
        options:{
          data:{
            display_name:name,
            username
          }
        }
      });

      if(error){
        throw error;
      }

      if(data.session){

        state.session=data.session;
        state.user=data.user;

        await ensureProfile();
        await loadData();

        renderApp();

      }else{

        toast(
          "Account created. Check your email to confirm, then sign in."
        );
      }

    }else{

      const {
        data,
        error
      } = await sb.auth.signInWithPassword({
        email,
        password
      });

      if(error){
        throw error;
      }

      state.session=data.session;
      state.user=data.user;

      await ensureProfile();
      await loadData();

      renderApp();
    }

  }catch(e){

    toast(
      errText(e)
    );

  }finally{

    if(btn){

      btn.disabled=false;

      btn.textContent=
        mode==="login"
        ? "Sign in securely"
        : "Create my account";
    }
  }
}

async function signOut(){

  await sb.auth.signOut();

  state.session=null;

}

function attachSwipe(){

  const root=
    document.getElementById("views");

  if(!root){
    return;
  }

  root.addEventListener(
    "touchstart",
    e=>{
      state.swipeStart=
        e.touches[0].clientX;
    },
    {passive:true}
  );

  root.addEventListener(
    "touchend",
    e=>{

      if(state.swipeStart==null){
        return;
      }

      const dx=
        e.changedTouches[0].clientX -
        state.swipeStart;

      state.swipeStart=null;

      if(Math.abs(dx)<70){
        return;
      }

      const tabs=[
        "home",
        "media",
        "map",
        "circles",
        "messages",
        "profile"
      ];

      let i=
        tabs.indexOf(state.tab);

      i=
        dx<0
        ? Math.min(5,i+1)
        : Math.max(0,i-1);

      if(tabs[i]!==state.tab){
        go(tabs[i]);
      }

    },
    {passive:true}
  );
}

async function askAI(){

  const input=
    document.getElementById("aiInput");

  const text=
    input?.value.trim();

  if(!text){
    return;
  }

  input.value="";

  state.aiHistory.push({
    role:"user",
    text
  });

  renderApp();

  document
    .getElementById("aiChat")
    ?.scrollTo(0,99999);

  try{

    const token=
      state.session?.access_token ||
      SUPABASE_ANON_KEY;

    const res=
      await fetch(
        AI_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_ANON_KEY,
            "Authorization":"Bearer "+token
          },

          body:JSON.stringify({
            message:text,

            history:
              state.aiHistory
                .slice(-12)
                .map(
                  m=>({
                    role:m.role,
                    content:m.text
                  })
                )
          })
        }
      );

    const raw=
      await res.text();

    let data={};

    try{
      data=JSON.parse(raw);
    }catch{}

    if(!res.ok){

      throw new Error(
        data.error ||
        data.message ||
        raw ||
        ("HTTP "+res.status)
      );
    }

    if(
      !Object.keys(data).length &&
      raw.trim().startsWith("<")
    ){

      throw new Error(
        "The Edge Function returned an HTML error page. Check that track-circle-a is deployed and accepts POST requests."
      );
    }

    const answer=
      data.answer ??
      data.response ??
      data.text ??
      data.message ??
      data.reply ??
      data.output ??
      (
        data.data?.answer ||
        data.data?.response ||
        data.data?.text
      );

    if(typeof answer!=="string"){

      throw new Error(
        "The Edge Function returned a response in an unexpected format."
      );
    }

    state.aiHistory.push({
      role:"assistant",
      text:answer
    });

  }catch(e){

    state.aiHistory.push({
      role:"assistant",
      text:
        "Track Circle AI could not be reached. " +
        errText(e)
    });
  }

  renderApp();

async function uploadFile(file,folder){

  if(!file){
    throw new Error(
      "No file selected."
    );
  }

  const ext=
    (
      file.name.split(".").pop() ||
      "bin"
    ).toLowerCase();

  const path=
    `${folder}/${state.user.id}/${crypto.randomUUID()}.${ext}`;

  const {
    error
  } = await sb
    .storage
    .from(MEDIA_BUCKET)
    .upload(
      path,
      file,
      {
        upsert:false,
        contentType:file.type || undefined
      }
    );

  if(error){
    throw error;
  }

  const {data}=
    sb
      .storage
      .from(MEDIA_BUCKET)
      .getPublicUrl(path);

  return data.publicUrl;
}

  try{

    toast("Uploading…");

    const media=
      file
      ? await uploadFile(file,"posts")
      : null;

    const {
      error
    } = await sb
      .from("posts")
      .insert({
        user_id:state.user.id,
        caption,
        media_url:media,
        media_type:
          file?.type?.startsWith("video/")
          ? "video"
          : file
          ? "image"
          : "text",
        thumbnail_url:null

      throw error;

    await loadPosts();
    await loadStats();

    go("media");

  }catch(e){

      error

      .from("post_likes")
      .delete()
      .eq("post_id",postId)
      .eq("user_id",state.user.id);

    if(error){
      return toast(errText(error));
    }

    state.liked.delete(postId);

  }else{

    const {
      error

      .from("post_likes")
      .insert({
        post_id:postId,
        user_id:state.user.id
      });

    if(error){
      return toast(errText(error));
    }

    state.liked.add(postId);
  }

  renderApp();

let watchId=null;

async function toggleLocation(){

  if(!navigator.geolocation){

    return toast(
      "This browser does not provide GPS."
    );
  }

  if(watchId!=null){

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId=null;

    toast(
      "Location sharing stopped."
    );

    return;
  }

  watchId=
    navigator.geolocation.watchPosition(

      async pos=>{

        const {
          latitude,
          longitude
        } = pos.coords;

        const {
          error
        } = await sb
          .from("locations")
          .upsert(
            {
              user_id:state.user.id,
              latitude,
              longitude,
              sharing_enabled:true,
              updated_at:new Date().toISOString()
            },
            {
              onConflict:"user_id"
            }
          );

        if(error){

          toast(
            "Location database error: " +
            errText(error)
          );

        }else{

          document
            .getElementById("gpsStatus")
            ?.replaceChildren(
              document.createTextNode(
                `Live: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`
              )
            );
        }

      },

      e=>{
        toast(
          "GPS: " +
          e.message
        );
      },

      {
        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:15000
      }
    );

  toast(
    "Location permission requested."
  );
}

async function createCircle(){

  const name=
    document
      .getElementById("circleName")
      ?.value.trim();

  const type=
    document
      .getElementById("circleType")
      ?.value;

  if(!name){
    return toast(
      "Enter a circle name."
    );
  }

  const code=
    "TC-" +
    Math.random()
      .toString(36)
      .slice(2,7)
      .toUpperCase();

  const {
    data,
    error
  } = await sb
    .from("circles")
    .insert({
      name,
      type,
      invite_code:code,
      owner_id:state.user.id
    })
    .select("*")
    .single();

  if(error){
    return toast(
      errText(error)
    );
  }

  const {
    error:me
  } = await sb
    .from("circle_members")
    .insert({
      circle_id:data.id,
      user_id:state.user.id,
      role:"owner"
    });

  if(me){
    return toast(
      errText(me)
    );
  }

  document
    .querySelector(".modal")
    ?.remove();

  await loadCircles();
  await loadStats();

  renderApp();

  toast(
    "Circle created: " +
    code
  );
}

  const {
    data:c,
    error
  } = await sb
    .from("circles")
    .select("*")
    .eq("invite_code",code)
    .maybeSingle();

  if(error){
    return toast(
      errText(error)
    );
  }

  if(!c){
    return toast(
      "Circle not found."
    );
  }

  const {
    error:me
  } = await sb
    .from("circle_members")
    .upsert(
      {
        circle_id:c.id,
        user_id:state.user.id,
        role:"member"
      },
      {
        onConflict:"circle_id,user_id"
      }
    );

  if(me){
    return toast(
      errText(me)
    );
  }

  document
    .querySelector(".modal")
    ?.remove();

  await loadCircles();
  await loadStats();

  renderApp();

  toast(
    "Joined " +
    c.name
  );
}

function openChat(id){

  const p=
    state.profiles.find(
      x=>x.id===id
    );

  const msgs=
    state.messages.filter(
      m=>
        (
          m.sender_id===state.user.id &&
          m.receiver_id===id
        ) ||
        (
          m.sender_id===id &&
          m.receiver_id===state.user.id
        )
    );

  modal(`
    <div class="row">

      ${avatar(p)}

      <div>

        <h2>
          ${esc(
            p?.display_name ||
            "User"
          )}
        </h2>

        <div class="muted small">
          @${esc(
            p?.username ||
            "user"
          )}
        </div>

      </div>

    </div>

    <div
      id="chatMessages"
      class="chat"
      style="height:360px"
    >

      ${
        msgs
          .map(
            m=>
            `
              <div
                class="bubble ${m.sender_id===state.user.id?"me":""}"
              >
                ${esc(m.content || "")}
              </div>
            `
          )
          .join("")
        ||
        `
          <div class="empty">
            Start the conversation.
          </div>
        `
      }

    </div>

    <div class="composer">

      <input
        id="msgInput"
        class="input"
        placeholder="Message…"
        onkeydown="if(event.key==='Enter')sendMessage('${id}')"
      >

      <button
        class="btn"
        onclick="sendMessage('${id}')"
      >
        Send
      </button>

    </div>
  `);
}

async function sendMessage(id){

  const input=
    document.getElementById("msgInput");

  const content=
    input?.value.trim();

  if(!content){
    return;
  }

  const {
    error
  } = await sb
    .from("messages")
    .insert({
      sender_id:state.user.id,
      receiver_id:id,
      circle_id:null,
      content,
      message_type:"text",
      media_url:null
    });

  if(error){
    return toast(
      errText(error)
    );
  }

  input.value="";

  await loadMessages();

  document
    .querySelector(".modal")
    ?.remove();

  openChat(id);
}

async function saveProfile(){

  const display_name=
    document
      .getElementById("profileName")
      ?.value.trim();

  const username=
    document
      .getElementById("profileUsername")
      ?.value
      .trim()
      .toLowerCase();

  const bio=
    document
      .getElementById("profileBio")
      ?.value.trim();

  if(!display_name || !username){

    return toast(
      "Display name and username are required."
    );
  }

  const {
    data,
    error
  } = await sb
    .from("profiles")
    .update({
      display_name,
      username,
      bio,
      updated_at:new Date().toISOString()
    })
    .eq("id",state.user.id)
    .select("*")
    .single();

  if(error){

    toast(
      "Profile save failed: " +
      errText(error)
    );

    return;
  }

  state.profile=data;

  toast(
    "Profile saved."
  );

  renderApp();
}

async function changeAvatar(e){

  const file=
    e.target.files?.[0];

  if(!file){
    return;
  }

  try{

    toast(
      "Uploading profile photo…"
    );

    const url=
      await uploadFile(
        file,
        "avatars"
      );

    const {
      data,
      error
    } = await sb
      .from("profiles")
      .update({
        avatar_url:url,
        updated_at:new Date().toISOString()
      })
      .eq("id",state.user.id)
      .select("*")
      .single();

    if(error){
      throw error;
    }

    state.profile=data;

    toast(
      "Profile photo updated."
    );

    renderApp();

  }catch(x){

    toast(
      "Photo upload failed: " +
      errText(x) +
      " — make sure the track-circle-media bucket and policies exist."
    );
  }
}
