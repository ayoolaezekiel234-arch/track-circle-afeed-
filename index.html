<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Track Circle — Stay Connected. Stay Close.</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #030a08; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 430px; background: #071712; min-height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden; }

    .view-screen { display: none; flex-direction: column; flex: 1; padding: 24px 20px 40px; overflow-y: auto; height: 100vh; }
    .view-screen.active-view { display: flex; }

    /* Screen 1: Splash / Onboarding style matching reference */
    #view-splash {
      background: linear-gradient(180deg, rgba(3, 10, 8, 0.4) 0%, rgba(5, 17, 13, 0.85) 60%, #071712 100%), 
                  url('https://images.unsplash.com/photo-1511497584788-87676119707a?w=800') center/cover no-repeat;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      padding-bottom: 36px;
    }

    .brand-logo-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #059669, #10b981);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 0 25px rgba(16,185,129,0.4);
      font-size: 30px;
    }

    .brand-title { font-size: 34px; font-weight: 900; color: #fff; letter-spacing: -0.5px; margin-bottom: 6px; }
    .brand-title span { color: #10b981; }
    .brand-subtitle { font-size: 13px; color: #94a3b8; font-weight: 500; margin-bottom: 40px; }

    /* Feature Icon Pills */
    .features-row { display: flex; justify-content: center; gap: 24px; width: 100%; margin-bottom: 50px; }
    .feature-pill { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 90px; }
    .feature-icon-circle { width: 44px; height: 44px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #10b981; }
    .feature-pill span { font-size: 10px; color: #cbd5e1; font-weight: 600; line-height: 1.2; text-align: center; }

    /* Dots Pagination */
    .dots-row { display: flex; gap: 6px; margin-bottom: 24px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #13382c; }
    .dot.active { width: 20px; border-radius: 3px; background: #10b981; }

    /* Buttons */
    .btn-main { width: 100%; max-width: 380px; padding: 16px; background: #10b981; color: #04100c; border-radius: 16px; font-size: 14px; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Screen 2: Sign In style matching reference */
    .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; width: 100%; }
    .back-arrow { font-size: 18px; color: #fff; cursor: pointer; background: none; border: none; }
    .help-link { font-size: 12px; color: #94a3b8; font-weight: 600; cursor: pointer; }

    .auth-heading { margin-bottom: 24px; width: 100%; }
    .auth-heading h1 { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .auth-heading p { font-size: 12px; color: #94a3b8; }

    .input-box-group { margin-bottom: 16px; width: 100%; }
    .input-box-group label { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 6px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper span { position: absolute; left: 14px; font-size: 16px; }
    .input-wrapper input { width: 100%; padding: 14px 14px 14px 44px; background: #0b221a; border: 1px solid #13382c; border-radius: 14px; color: #fff; font-size: 13px; outline: none; }
    .input-wrapper input:focus { border-color: #10b981; }
    .input-wrapper .right-icon { position: absolute; right: 14px; cursor: pointer; color: #64748b; font-size: 16px; }

    .auth-options-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 20px; font-size: 12px; width: 100%; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; color: #cbd5e1; font-weight: 600; cursor: pointer; }
    .checkbox-label input { width: 16px; height: 16px; accent-color: #10b981; border-radius: 4px; }
    .forgot-link { color: #10b981; font-weight: 600; cursor: pointer; text-decoration: none; }

    .divider-line { display: flex; align-items: center; text-align: center; color: #475569; font-size: 11px; margin: 24px 0; width: 100%; }
    .divider-line::before, .divider-line::after { content: ''; flex: 1; border-bottom: 1px solid #13382c; }
    .divider-line::before { margin-right: 12px; }
    .divider-line::after { margin-left: 12px; }

    .btn-social { width: 100%; padding: 14px; background: #0b221a; border: 1px solid #13382c; border-radius: 14px; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; margin-bottom: 24px; }
    
    .auth-switch-text { text-align: center; font-size: 12px; color: #94a3b8; width: 100%; }
    .auth-switch-text span { color: #10b981; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">

    <!-- SCREEN 1: SPLASH & ONBOARDING -->
    <div id="view-splash" class="view-screen active-view">
      <div style="margin-bottom: auto; padding-top: 60px;">
        <div class="brand-logo-icon">📍</div>
        <div class="brand-title">Track<span>Circle</span></div>
        <div class="brand-subtitle">Stay Connected. Stay Close.</div>
      </div>

      <div class="features-row">
        <div class="feature-pill">
          <div class="feature-icon-circle">📍</div>
          <span>Real-Time Location</span>
        </div>
        <div class="feature-pill">
          <div class="feature-icon-circle">💬</div>
          <span>Group & Private Messaging</span>
        </div>
        <div class="feature-pill">
          <div class="feature-icon-circle">👥</div>
          <span>Create & Join Circles</span>
        </div>
      </div>

      <div class="dots-row">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <button class="btn-main" onclick="switchScreen('view-signin')">
        Get Started <span>→</span>
      </button>
    </div>

    <!-- SCREEN 2: WELCOME BACK SIGN IN -->
    <div id="view-signin" class="view-screen">
      <div class="top-nav-bar">
        <button class="back-arrow" onclick="switchScreen('view-splash')">←</button>
        <span class="help-link" onclick="alert('Need help? Contact support.')">Need help?</span>
      </div>

      <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #059669, #10b981); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 22px;">📍</div>
        <div style="font-size: 20px; font-weight: 900; color: #fff;">Track<span>Circle</span></div>
      </div>

      <div class="auth-heading">
        <h1>Welcome Back</h1>
        <p>Sign in to continue to your account</p>
      </div>

      <div class="input-box-group">
        <label>Email or Username</label>
        <div class="input-wrapper">
          <span>✉️</span>
          <input type="text" id="signin-identifier" value="ezekiel_01" placeholder="Enter email or username" />
        </div>
      </div>

      <div class="input-box-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span>🔒</span>
          <input type="password" id="signin-password" value="••••••••" placeholder="Enter password" />
          <span class="right-icon" onclick="togglePasswordVisibility()">👁️</span>
        </div>
      </div>

      <div class="auth-options-row">
        <label class="checkbox-label">
          <input type="checkbox" checked /> Remember me
        </label>
        <span class="forgot-link" onclick="alert('Password reset link sent!')">Forgot password?</span>
      </div>

      <button class="btn-main" onclick="handleUserSignIn()">
        Sign In <span>→</span>
      </button>

      <div class="divider-line">or</div>

      <button class="btn-social" onclick="alert('Google Auth integration ready!')">
        <span style="font-size: 16px;">🌐</span> Continue with Google
      </button>

      <div class="auth-switch-text">
        Don’t have an account? <span onclick="alert('Registration flow coming up next!')">Sign Up</span>
      </div>
    </div>

  </div>

  <script>
    function switchScreen(screenId) {
      document.querySelectorAll('.view-screen').forEach(el => el.classList.remove('active-view'));
      document.getElementById(screenId).classList.add('active-view');
    }

    function togglePasswordVisibility() {
      var passInput = document.getElementById("signin-password");
      if (passInput.type === "password") {
        passInput.type = "text";
      } else {
        passInput.type = "password";
      }
    }

    function handleUserSignIn() {
      var identifier = document.getElementById("signin-identifier").value.trim();
      if (!identifier) {
        alert("Please enter your email or username.");
        return;
      }
      alert("Signing in successfully as " + identifier + "! Next, we will build your Home Dashboard & Map screen.");
    }
  </script>
</body>
</html>
