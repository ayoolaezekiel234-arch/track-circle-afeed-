<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL =
  "https://olivaregvcejjghrjdio.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Vf4Yx7ia3Mlg_4JuSmLAxA_vxRuQ1zr";

const AI_URL =
  "https://olivaregvcejjghrjdio.supabase.co/functions/v1/track-circle-ai";

const MEDIA_BUCKET =
  "track-circle-media";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );

const state = {
  session:null,
  user:null,
  profile:null,
  tab:"home",
  posts:[],
  comments:{},
  liked:new Set(),
  following:new Set(),
  circles:[],
  messages:[],
  profiles:[],
  aiHistory:[],
  swipeStart:null,
  stats:{
    posts:0,
    followers:0,
    following:0,
    circles:0,
    likesReceived:0
  }
};

function esc(v=""){
  return String(v).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[m])
  );
}

function toast(msg){
  const el=document.getElementById("toast");

  el.textContent=msg;

  el.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast=setTimeout(
    ()=>el.classList.remove("show"),
    3200
  );
}

function initials(p){
  return esc(
    (
      p?.display_name ||
      p?.username ||
      "TC"
    )
    .trim()
    .split(/\s+/)
    .map(x=>x[0])
    .slice(0,2)
    .join("")
    .toUpperCase()
    || "TC"
  );
}

function verifiedBadge(p){
  return p?.is_verified
    ? `<span class="verified" title="Verified">✓</span>`
    : "";
}

function avatar(p,cls="avatar"){
  return p?.avatar_url
    ? `<img class="${cls}" src="${esc(p.avatar_url)}" alt="${esc(p?.display_name || "User")}">`
    : `<div class="${cls}">${initials(p)}</div>`;
}

function fmtDate(d){
  try{
    return new Intl.DateTimeFormat(
      undefined,
      {
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    ).format(new Date(d));
  }catch{
    return "";
  }
}

function errText(e){
  return e?.message ||
    e?.error_description ||
    "Something went wrong.";
}

function setRoot(html){
  document.getElementById("root").innerHTML=html;
}

function currentName(){
  return state.profile?.display_name ||

async function boot(){

  const splash=document.getElementById("splash");

  setTimeout(
    ()=>splash?.classList.add("hide"),
    900
  );

  const {
    data:{session}
  }=await sb.auth.getSession();

  state.session=session;
  state.user=session?.user || null;

  if(!state.user){
    renderAuth();
    return;
  }

  await ensureProfile();

  await loadData();

  renderApp();

  sb.auth.onAuthStateChange(
    async(_e,s)=>{
      state.session=s;
      state.user=s?.user || null;

      if(!s){
        renderAuth();
      }
    }
  );
}

async function ensureProfile(){

  if(!state.user){
    return;
  }

  const {
    data,
    error
  }=await sb
    .from("profiles")
    .select("*")
    .eq("id",state.user.id)
    .maybeSingle();

  if(error){
    console.error(error);

    toast(
      "Profiles access is blocked by RLS. Run the SQL patch below."
    );

    return;
  }

  if(data){
    state.profile=data;
    return;
  }

  const base=(
    state.user.user_metadata?.display_name ||
    state.user.email?.split("@")[0] ||
    "Track Circle User"
  ).trim();

  const username=(
    state.user.user_metadata?.username ||
    base
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"")
      .slice(0,24) ||
    ("user"+Date.now().toString().slice(-5))
  );

  const {
    data:created,
    error:e
  }=await sb
    .from("profiles")
    .insert({
      id:state.user.id,
      display_name:base,
      username
    })
    .select("*")
    .single();

  if(e){
    toast(
      "Could not create your profile: "+
      errText(e)
    );

    return;
  }

  state.profile=created;
}

async function loadData(){

  await Promise.allSettled([
    loadPosts(),
    loadFollowing(),
    loadCircles(),
    loadProfiles()
  ]);

  await loadStats();
}

async function loadProfiles(){

  const {data}=await sb
    .from("profiles")
    .select("*")
    .order("display_name")
    .limit(100);

  state.profiles=data || [];
}

async function loadPosts(){

  const {
    data,
    error
  }=await sb
    .from("posts")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(50);

  if(error){
    console.error(error);

    state.posts=[];

    return;
  }

  state.posts=data || [];

  const ids=state.posts.map(
    post=>post.id
  );

  if(!ids.length){

    state.liked=new Set();

    return;
  }

  const {data:likes}=await sb
    .from("post_likes")
    .select("post_id,user_id")
    .in("post_id",ids);

  const likeCounts={};

  (likes || []).forEach(
    like=>{
      likeCounts[like.post_id]=
        (likeCounts[like.post_id] || 0)+1;
    }
  );

  state.posts=state.posts.map(
    post=>({
      ...post,
      _likeCount:
        likeCounts[post.id] || 0
    })
  );

  state.liked=new Set(
    (likes || [])
      .filter(
        like=>like.user_id===state.user.id
      )
      .map(
        like=>like.post_id
      )
  );
}

async function loadFollowing(){

  const {data}=await sb
    .from("follows")
    .select("following_id")
    .eq(
      "follower_id",
      state.user.id
    );

  state.following=new Set(
    (data || []).map(
      x=>x.following_id
    )
  );
}

async function loadCircles(){

  const {
    data:members
  }=await sb
    .from("circle_members")
    .select("circle_id,role")
    .eq(
      "user_id",
      state.user.id
    );

  const ids=(members || [])
    .map(x=>x.circle_id);

  if(!ids.length){

    state.circles=[];

    return;
  }

  const {data}=await sb
    .from("circles")
    .select("*")
    .in("id",ids)
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  state.circles=data || [];
}

async function loadStats(){

  const [
    posts,
    followers,
    following,
    circles
  ]=await Promise.all([

    sb
      .from("posts")
      .select("id",{count:"exact",head:true})
      .eq(
        "user_id",
        state.user.id
      ),

    sb
      .from("follows")
      .select("id",{count:"exact",head:true})
      .eq(
        "following_id",
        state.user.id
      ),

    sb
      .from("follows")
      .select("id",{count:"exact",head:true})
      .eq(
        "follower_id",
        state.user.id
      ),

    sb
      .from("circle_members")
      .select(
        "circle_id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "user_id",
        state.user.id
      )
  ]);

  const {
    data:myPosts
  }=await sb
    .from("posts")
    .select("id")
    .eq(
      "user_id",
      state.user.id
    );

  let likesReceived=0;

  if(myPosts?.length){

    const postIds=myPosts.map(
      post=>post.id
    );

    const {count}=await sb
      .from("post_likes")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .in(
        "post_id",
        postIds
      );

    likesReceived=count || 0;
  }

  state.stats={
    posts:posts.count || 0,
    followers:followers.count || 0,
    following:following.count || 0,
    circles:circles.count || 0,
    likesReceived
  };
}

async function submitAuth(mode){

  const email=
    document.getElementById("authEmail")
      ?.value.trim();

  const password=
    document.getElementById("authPassword")
      ?.value;

  if(!email || !password){
    return toast(
      "Enter your email and password."
    );
  }

  const btn=
    document.querySelector(
      ".authbox .btn:last-child"
    );

  if(btn){
    btn.disabled=true;
    btn.textContent="Connecting…";
  }

  try{

    if(mode==="signup"){

      const name=
        document.getElementById("authName")
          ?.value.trim()
        ||
        email.split("@")[0];

      const username=
        (
          document.getElementById("authUsername")
            ?.value.trim()
          ||
          name
        )
        .toLowerCase()
        .replace(/[^a-z0-9_]/g,"")
        .slice(0,24);

      const {
        data,
        error
      }=await sb.auth.signUp({
        email,
        password,
        options:{
          data:{
            display_name:name,
            username
          }
        }
      });

      if(error){
        throw error;
      }

      if(data.session){

        state.session=data.session;
        state.user=data.user;

        await ensureProfile();
        await loadData();

        renderApp();

      }else{

        toast(
          "Account created. Check your email to confirm, then sign in."
        );
      }

    }else{

      const {
        data,
        error
      }=await sb.auth.signInWithPassword({
        email,
        password
      });

      if(error){
        throw error;
      }

      state.session=data.session;
      state.user=data.user;

      await ensureProfile();
      await loadData();

      renderApp();
    }

  }catch(e){

    toast(
      errText(e)
    );

  }finally{

    if(btn){

      btn.disabled=false;

      btn.textContent=
        mode==="login"
          ? "Sign in securely"
          : "Create my account";
    }
  }
}

function attachSwipe(){

  const root=
    document.getElementById("views");

  if(!root){
    return;
  }

  root.addEventListener(
    "touchstart",
    e=>{
      state.swipeStart=
        e.touches[0].clientX;
    },
    {
      passive:true
    }
  );

  root.addEventListener(
    "touchend",
    e=>{

      if(state.swipeStart==null){
        return;
      }

      const dx=
        e.changedTouches[0].clientX -
        state.swipeStart;

      state.swipeStart=null;

      if(Math.abs(dx)<70){
        return;
      }

      const tabs=[
        "home",
        "media",
        "map",
        "circles",
        "messages",
        "profile"
      ];

      let i=tabs.indexOf(
        state.tab
      );

      i=
        dx<0
          ? Math.min(5,i+1)
          : Math.max(0,i-1);

      if(tabs[i]!==state.tab){
        go(tabs[i]);
      }

    },
    {
      passive:true
    }
  );
}

async function askAI(){

  const input=
    document.getElementById("aiInput");

  const text=
    input?.value.trim();

  if(!text){
    return;
  }

  input.value="";

  state.aiHistory.push({
    role:"user",
    text
  });

  renderApp();

  const chat=
    document.getElementById("aiChat");

  if(chat){
    chat.scrollTop=
      chat.scrollHeight;
  }

  const token=
    state.session?.access_token;

  if(!token){

    state.aiHistory.push({
      role:"assistant",
      text:
        "Please sign in again before using Track AI."
    });

    renderApp();

    return;
  }

  let lastError=
    "Track AI could not be reached.";

  for(
    let attempt=1;
    attempt<=3;
    attempt++
  ){

    try{

      const response=
        await fetch(
          AI_URL,
          {
            method:"POST",

            headers:{
              "Content-Type":"application/json",
              "apikey":SUPABASE_ANON_KEY,
              "Authorization":
                "Bearer "+token
            },

            body:JSON.stringify({
              message:text,

              history:
                state.aiHistory
                  .slice(-12)
                  .map(
                    message=>({
                      role:message.role,
                      content:message.text
                    })
                  )
            })
          }
        );

      const raw=
        await response.text();

      let data={};

      try{

        data=
          raw
            ? JSON.parse(raw)
            : {};

      }catch{

        data={};

      }

      if(!response.ok){

        const serverMessage=
          data.error ||
          data.message ||
          data.details ||
          raw ||
          `HTTP ${response.status}`;

        lastError=
          String(serverMessage);

        const isTemporary=
          response.status===429 ||
          response.status===408 ||
          response.status>=500 ||
          /high demand|temporar|rate.?limit|overload|unavailable/i
            .test(lastError);

        if(
          isTemporary &&
          attempt<3
        ){

          await new Promise(
            resolve=>
              setTimeout(
                resolve,
                attempt*1200
              )
          );

          continue;
        }

        throw new Error(
          lastError
        );
      }

      const answer=
        data.answer ??
        data.response ??
        data.text ??
        data.message ??
        data.reply ??
        data.output ??
        data.data?.answer ??
        data.data?.response ??
        data.data?.text;

      if(
        typeof answer!=="string" ||
        !answer.trim()
      ){

        throw new Error(
          "Track AI returned an unexpected response format."
        );
      }

      state.aiHistory.push({
        role:"assistant",
        text:answer.trim()
      });

      renderApp();

      return;

    }catch(error){

      lastError=
        error?.message ||
        "Track AI request failed.";

      if(
        attempt<3 &&
        /high demand|temporar|rate.?limit|overload|unavailable|network|fetch/i
          .test(lastError)
      ){

        await new Promise(
          resolve=>
            setTimeout(
              resolve,
              attempt*1200
            )
        );

        continue;
      }

      break;
    }
  }

  state.aiHistory.push({
    role:"assistant",
    text:
      `Track AI is temporarily unavailable. ${lastError}

Tap Send again in a moment. I am not showing a fake AI response.`
  });

  renderApp();
}

async function uploadFile(
  file,
  folder
){

  if(!file){
    throw new Error(
      "No file selected."
    );
  }

  if(!state.user?.id){
    throw new Error(
      "You must be signed in before uploading."
    );
  }

  const bucket=
    sb.storage.from(
      MEDIA_BUCKET
    );

  const ext=
    (
      file.name
        .split(".")
        .pop()
        ||
      "bin"
    )
    .toLowerCase();

  const path=
    `${folder}/${state.user.id}/${Date.now()}_${crypto.randomUUID()}.${ext}`;

  const {
    error
  }=await bucket.upload(
    path,
    file,
    {
      upsert:false,
      contentType:
        file.type || undefined,
      cacheControl:"3600"
    }
  );

  if(error){

    if(
      /bucket|not found/i
        .test(
          error.message || ""
        )
    ){

      throw new Error(
        `Storage bucket "${MEDIA_BUCKET}" was not found.`
      );
    }

    if(
      /row-level security|permission denied|not authorized/i
        .test(
          error.message || ""
        )
    ){

      throw new Error(
        `Storage permission denied. Allow authenticated uploads to ${MEDIA_BUCKET}.`
      );
    }

    throw error;
  }

  const {
    data
  }=
    bucket.getPublicUrl(
      path
    );

  if(!data?.publicUrl){

    throw new Error(
      "Upload succeeded but no public URL was returned."
    );
  }

  return data.publicUrl;
}

async function createPost(){

  const file=
    document.getElementById("postFile")
      ?.files?.[0];

  const caption=
    document.getElementById("postCaption")
      ?.value.trim()
    ||
    "";

  if(!file && !caption){

    return toast(
      "Add a photo, video or caption."
    );
  }

  try{

    toast("Uploading…");

    const media=
      file
        ? await uploadFile(
            file,
            "posts"
          )
        : null;

    const {
      error
    }=await sb
      .from("posts")
      .insert({
        user_id:state.user.id,
        caption,
        media_url:media,
        media_type:
          file?.type?.startsWith("video/")
            ? "video"
            : file
              ? "image"
              : "text",
        thumbnail_url:null
      });

    if(error){
      throw error;
    }

    toast("Posted.");

    await loadPosts();
    await loadStats();

    go("media");

  }catch(e){

    toast(
      "Post failed: "+
      errText(e)
    );
  }
}

let locationWatcher=null;
let currentPosition=null;

async function toggleLocation(){

  if(!navigator.geolocation){

    return toast(
      "This device/browser does not support GPS location."
    );
  }

  if(locationWatcher!==null){

    navigator.geolocation.clearWatch(
      locationWatcher
    );

    locationWatcher=null;

    await saveLocation(
      null
    );

    renderApp();

    toast(
      "Location sharing stopped."
    );

    return;
  }

  toast(
    "Requesting location permission…"
  );

  locationWatcher=
    navigator.geolocation.watchPosition(
      async position=>{

        currentPosition=position;

        const lat=
          position.coords.latitude;

        const lng=
          position.coords.longitude;

        await saveLocation(
          position
        );

        updateMapPosition(
          lat,
          lng
        );

      },

      error=>{

        locationWatcher=null;

        let message=
          "Unable to get your location.";

        if(error.code===1){
          message=
            "Location permission was denied.";
        }

        if(error.code===2){
          message=
            "Your location could not be determined.";
        }

        if(error.code===3){
          message=
            "Location request timed out.";
        }

        toast(message);

        const status=
          document.getElementById(
            "locationStatus"
          );

        const details=
          document.getElementById(
            "locationDetails"
          );

        if(status){
          status.textContent=
            "Location unavailable";
        }

        if(details){
          details.textContent=
            message;
        }

      },

      {
        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:15000
      }
    );

  const status=
    document.getElementById(
      "locationStatus"
    );

  const details=
    document.getElementById(
      "locationDetails"
    );

  if(status){
    status.textContent=
      "Location sharing on";
  }

  if(details){
    details.textContent=
      "Waiting for your GPS position…";
  }
}


async function locateMe(){

  if(!navigator.geolocation){

    return toast(
      "GPS is not available in this browser."
    );
  }

  navigator.geolocation.getCurrentPosition(

    async position=>{

      currentPosition=position;

      const lat=
        position.coords.latitude;

      const lng=
        position.coords.longitude;

      updateMapPosition(
        lat,
        lng
      );

      await saveLocation(
        position
      );

      toast(
        "Your location was updated."
      );

    },

    error=>{

      if(error.code===1){

        toast(
          "Please allow location access in your browser."
        );

      }else{

        toast(
          "Could not get your location."
        );

      }

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:5000
    }
  );
}


function updateMapPosition(
  lat,
  lng
){

  const pin=
    document.getElementById(
      "userPin"
    );

  const message=
    document.getElementById(
      "mapMessage"
    );

  const status=
    document.getElementById(
      "locationStatus"
    );

  const details=
    document.getElementById(
      "locationDetails"
    );

  if(pin){

    /*
      The visual map in this single-file version
      is intentionally only a GPS status surface.
      It does NOT pretend to be Google Maps.
    */

    pin.style.left="50%";
    pin.style.top="50%";
  }

  if(message){

    message.textContent=
      `GPS active · ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }

  if(status){

    status.textContent=
      "Location sharing on";
  }

  if(details){

    details.textContent=
      `Accuracy ±${Math.round(
        currentPosition?.coords?.accuracy || 0
      )} metres`;
  }
}


async function saveLocation(
  position
){

  if(!state.user){
    return;
  }

  if(!position){

    /*
      We deliberately do not write a fake location.
      If your locations table has a sharing/status
      column, the SQL/RLS policy should handle it.
    */

    return;
  }

  const latitude=
    position.coords.latitude;

  const longitude=
    position.coords.longitude;

  const accuracy=
    position.coords.accuracy;

  const payload={
    user_id:state.user.id,
    latitude,
    longitude,
    accuracy,
    updated_at:new Date().toISOString()
  };

  const {
    error
  }=await sb
    .from("locations")
    .upsert(
      payload,
      {
        onConflict:"user_id"
      }
    );

  if(error){

    console.error(
      "Location database error:",
      error
    );

    if(
      /permission denied|row-level security/i
        .test(
          error.message || ""
        )
    ){

      toast(
        "Location database permission is blocked by RLS."
      );
    }

  }
}

async function createCircle(){

  const name=
    document
      .getElementById("circleName")
      ?.value.trim();

  const description=
    document
      .getElementById("circleDescription")
      ?.value.trim()
    ||
    null;

  const privacy=
    document
      .getElementById("circlePrivacy")
      ?.value
    ||
    "private";

  if(!name){

    return toast(
      "Give your circle a name."
    );
  }

  try{

    toast(
      "Creating circle…"
    );

    /*
      IMPORTANT:

      We insert the circle first.

      We do NOT insert circle_members
      from a recursive client-side policy.

      Your Supabase SQL must permit the creator
      to insert their own membership.
    */

    const {
      data:circle,
      error
    }=await sb
      .from("circles")
      .insert({
        name,
        description,
        privacy,
        owner_id:state.user.id
      })
      .select("*")
      .single();

    if(error){
      throw error;
    }

    if(!circle){

      throw new Error(
        "Circle was not returned after creation."
      );
    }

    const {
      error:memberError
    }=await sb
      .from("circle_members")
      .insert({
        circle_id:circle.id,
        user_id:state.user.id,
        role:"owner"
      });

    if(memberError){

      /*
        If membership fails, do not claim that
        the circle is fully ready.
      */

      console.error(
        "Circle membership error:",
        memberError
      );

      throw new Error(
        "Circle was created but adding you as owner failed: "+
        errText(memberError)
      );
    }

    closeCircleModal();

    await loadCircles();
    await loadStats();

    renderApp();

    toast(
      "Circle created successfully."
    );

  }catch(e){

    toast(
      "Circle creation failed: "+
      errText(e)
    );

  }
}

function generateCircleCode(){

  const chars=
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result="TC-";

  for(
    let i=0;
    i<5;
    i++
  ){

    result+=
      chars[
        Math.floor(
          Math.random()*chars.length
        )
      ];
  }

  return result;
}


async function joinCircle(){

  let code=
    document
      .getElementById(
        "joinCircleCode"
      )
      ?.value
      .trim()
      .toUpperCase();

  if(!code){

    return toast(
      "Enter a circle code."
    );
  }

  try{

    toast(
      "Checking circle…"
    );

    const {
      data:circle,
      error
    }=await sb
      .from("circles")
      .select("*")
      .eq(
        "code",
        code
      )
      .maybeSingle();

    if(error){
      throw error;
    }

    if(!circle){

      return toast(
        "No circle was found with that code."
      );
    }

    const {
      error:memberError
    }=await sb
      .from("circle_members")
      .insert({
        circle_id:circle.id,
        user_id:state.user.id,
        role:"member"
      });

    if(memberError){

      if(
        /duplicate|already exists|unique/i
          .test(
            memberError.message || ""
          )
      ){

        return toast(
          "You are already in this circle."
        );
      }

      throw memberError;
    }

    document
      .getElementById(
        "joinCircleModal"
      )
      ?.remove();

    await loadCircles();
    await loadStats();

    renderApp();

    toast(
      `Joined ${circle.name || "circle"} successfully.`
    );

  }catch(e){

    toast(
      "Join failed: "+
      errText(e)
    );
  }
}

async function searchPeople(){

  const input=
    document.getElementById(
      "peopleSearch"
    );

  const results=
    document.getElementById(
      "searchResults"
    );

  const q=
    input?.value.trim();

  if(!q){

    if(results){
      results.innerHTML=
        `
          <div class="empty">
            Enter a name or username.
          </div>
        `;
    }

    return;
  }

  if(!results){
    return;
  }

  results.innerHTML=
    `
      <div class="empty">
        Searching…
      </div>
    `;

  try{

    /*
      We search by display_name and username
      separately instead of relying on a
      database-specific OR syntax.
    */

    const [
      byName,
      byUsername
    ]=await Promise.all([

      sb
        .from("profiles")
        .select("*")
        .ilike(
          "display_name",
          `%${q}%`
        )
        .limit(20),

      sb
        .from("profiles")
        .select("*")
        .ilike(
          "username",
          `%${q}%`
        )
        .limit(20)

    ]);

    if(
      byName.error ||
      byUsername.error
    ){

      throw (
        byName.error ||
        byUsername.error
      );
    }

    const map=
      new Map();

    [
      ...(byName.data || []),
      ...(byUsername.data || [])
    ]
    .forEach(
      p=>map.set(
        p.id,
        p
      )
    );

    const people=
      [...map.values()]
        .filter(
          p=>p.id!==state.user.id
        );

    if(!people.length){

      results.innerHTML=
        `
          <div class="empty">
            No Track Circle user found.
          </div>
        `;

      return;
    }

    const friendIds=
      await getFriendIds(
        people.map(
          p=>p.id
        )
      );

    results.innerHTML=
      people
        .map(
          p=>personResult(
            p,
            friendIds
          )
        )
        .join("");

  }catch(e){

    results.innerHTML=
      `
        <div class="aiError">
          Search failed:
          ${esc(
            errText(e)
          )}
        </div>
      `;
  }
}


async function getFriendIds(
  ids
){

  if(!ids.length){
    return new Set();
  }

  const results=
    await Promise.all([

      sb
        .from("friendships")
        .select(
          "id,requester_id,addressee_id,status"
        )
        .eq(
          "requester_id",
          state.user.id
        )
        .in(
          "addressee_id",
          ids
        ),

      sb
        .from("friendships")
        .select(
          "id,requester_id,addressee_id,status"
        )
        .eq(
          "addressee_id",
          state.user.id
        )
        .in(
          "requester_id",
          ids
        )

    ]);

  const error=
    results.find(
      x=>x.error
    )?.error;

  if(error){

    /*
      We intentionally expose the real RLS
      problem instead of pretending the friend
      relationship exists.
    */

    throw error;
  }

  const rows=[
    ...(results[0].data || []),
    ...(results[1].data || [])
  ];

  return new Map(
    rows.map(
      row=>{

        const other=
          row.requester_id===
            state.user.id
            ? row.addressee_id
            : row.requester_id;

        return [
          other,
          row
        ];
      }
    )
  );
}


function personResult(
  person,
  relationships
){

  const relationship=
    relationships.get(
      person.id
    );

  let buttonText=
    "Add friend";

  if(
    relationship?.status==="accepted"
  ){

    buttonText=
      "Friends";

  }else if(
    relationship?.status==="pending"
  ){

    buttonText=
      relationship.requester_id===
        state.user.id
        ? "Requested"
        : "Accept";

  }else if(
    relationship?.status==="declined"
  ){

    buttonText=
      "Add friend";
  }

  return `
    <div class="listitem">

      ${avatar(person)}

      <div class="grow">

        <b>
          ${esc(
            person.display_name ||
            "Track Circle User"
          )}

          ${verifiedBadge(person)}
        </b>

        <div class="muted small">
          @${esc(
            person.username ||
            "user"
          )}
        </div>

        ${
          relationship
            ?
          `
            <div class="friendStatus">
              ${esc(
                relationship.status ||
                "connected"
              )}
            </div>
          `
            :
          ""
        }

      </div>

      <button
        class="btn secondary"
        ${
          relationship?.status==="accepted"
            ||
          (
            relationship?.status==="pending" &&
            relationship.requester_id===
              state.user.id
          )
            ?
          "disabled"
            :
          ""
        }
        onclick="
          handleFriendAction(
            '${person.id}',
            '${relationship?.id || ""}',
            '${relationship?.status || ""}',
            '${relationship?.requester_id || ""}'
          )
        "
      >
        ${buttonText}
      </button>

    </div>
  `;
}


async function handleFriendAction(
  personId,
  relationshipId,
  status,
  requesterId
){

  try{

    if(
      status==="accepted"
    ){

      return;
    }

    if(
      status==="pending" &&
      requesterId!==state.user.id
    ){

      const {
        error
      }=await sb
        .from("friendships")
        .update({
          status:"accepted"
        })
        .eq(
          "id",
          relationshipId
        );

      if(error){
        throw error;
      }

      toast(
        "Friend request accepted."
      );

      await searchPeople();

      return;
    }

    if(
      status==="pending" &&
      requesterId===state.user.id
    ){

      return toast(
        "Friend request already sent."
      );
    }

    const {
      error
    }=await sb
      .from("friendships")
      .insert({
        requester_id:state.user.id,
        addressee_id:personId,
        status:"pending"
      });

    if(error){

      if(
        /duplicate|unique/i
          .test(
            error.message || ""
          )
      ){

        return toast(
          "Friend request already exists."
        );
      }

      throw error;
    }

    toast(
      "Friend request sent."
    );

    await searchPeople();

  }catch(e){

    toast(
      "Friend request failed: "+
      errText(e)
    );
  }
}


async function loadMessages(){

  const list=
    document.getElementById(
      "messageList"
    );

  if(!list){
    return;
  }

  list.innerHTML=
    `
      <div class="empty">
        Loading…
      </div>
    `;

  try{

    /*
      The messages table structure can differ
      between deployments, so this loader checks
      the most common direct-message columns.

      It does not fabricate conversations.
    */

    const {
      data,
      error
    }=await sb
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${state.user.id},receiver_id.eq.${state.user.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(100);

    if(error){
      throw error;
    }

    if(!data?.length){

      list.innerHTML=
        `
          <div class="empty">

            No messages yet.

            <br><br>

            Search for a friend above
            to start connecting.

          </div>
        `;

      return;
    }

    const people=
      Object.fromEntries(
        state.profiles.map(
          p=>[p.id,p]
        )
      );

    const conversations=
      new Map();

    data.forEach(
      message=>{

        const other=
          message.sender_id===
            state.user.id
            ? message.receiver_id
            : message.sender_id;

        if(!other){
          return;
        }

        if(
          !conversations.has(other)
        ){

          conversations.set(
            other,
            message
          );
        }
      }
    );

    list.innerHTML=
      [...conversations.entries()]
        .map(
          ([id,message])=>{
            const person=
              people[id] ||
              state.profiles.find(
                p=>p.id===id
              );

            return `
              <button
                class="listitem"
                style="
                  width:100%;
                  text-align:left;
                  color:inherit;
                  cursor:pointer;
                "
                onclick="
                  openChat('${id}')
                "
              >

                ${avatar(
                  person ||
                  {
                    display_name:"User"
                  }
                )}

                <div class="grow">

                  <b>
                    ${esc(
                      person?.display_name ||
                      "Track Circle User"
                    )}

                    ${verifiedBadge(person)}
                  </b>

                  <div class="muted small">
                    ${esc(
                      message.content ||
                      message.text ||
                      "Message"
                    )}
                  </div>

                </div>

                <div
                  class="muted small"
                >
                  ${fmtDate(
                    message.created_at
                  )}
                </div>

              </button>
            `;
          }
        )
        .join("");

  }catch(e){

    list.innerHTML=
      `
        <div class="aiError">

          Messages could not be loaded.

          <br>

          ${esc(
            errText(e)
          )}

        </div>
      `;
  }
}

async function loadPrivateMessages(
  personId
){

  const chat=
    document.getElementById(
      "privateChat"
    );

  if(!chat){
    return;
  }

  try{

    const {
      data,
      error
    }=await sb
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${state.user.id},receiver_id.eq.${personId}),and(sender_id.eq.${personId},receiver_id.eq.${state.user.id})`
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      )
      .limit(200);

    if(error){
      throw error;
    }

    if(!data?.length){

      chat.innerHTML=
        `
          <div class="empty">
            No messages yet.
            Start the conversation.
          </div>
        `;

      return;
    }

    chat.innerHTML=
      data
        .map(
          message=>{
            const mine=
              message.sender_id===
              state.user.id;

            return `
              <div
                class="bubble ${mine?"me":""}"
              >
                ${esc(
                  message.content ||
                  message.text ||
                  ""
                )}
              </div>
            `;
          }
        )
        .join("");

    chat.scrollTop=
      chat.scrollHeight;

  }catch(e){

    chat.innerHTML=
      `
        <div class="aiError">
          Could not load this conversation:
          ${esc(
            errText(e)
          )}
        </div>
      `;
  }
}

async function saveProfile(){

  const displayName=
    document
      .getElementById(
        "profileDisplayName"
      )
      ?.value.trim();

  const username=
    document
      .getElementById(
        "profileUsername"
      )
      ?.value.trim()
      .toLowerCase();

  const bio=
    document
      .getElementById(
        "profileBio"
      )
      ?.value.trim();

  const file=
    document
      .getElementById(
        "profilePhoto"
      )
      ?.files?.[0];

  if(!displayName){

    return toast(
      "Display name is required."
    );
  }

  if(
    username &&
    !/^[a-z0-9_]{3,24}$/.test(username)
  ){

    return toast(
      "Username must be 3–24 characters using letters, numbers or underscores."
    );
  }

  try{

    toast(
      "Saving profile…"
    );

    let avatarUrl=
      state.profile?.avatar_url ||
      null;

    if(file){

      avatarUrl=
        await uploadFile(
          file,
          "avatars"
        );
    }

    const updates={
      display_name:displayName,
      username:username || null,
      bio:bio || null,
      avatar_url:avatarUrl,
      updated_at:new Date().toISOString()
    };

    const {
      data,
      error
    }=await sb
      .from("profiles")
      .update(updates)
      .eq(
        "id",
        state.user.id
      )
      .select("*")
      .single();

    if(error){
      throw error;
    }

    state.profile=data;

    document
      .getElementById(
        "profileModal"
      )
      ?.remove();

    renderApp();

    toast(
      "Profile saved."
    );

  }catch(e){

    toast(
      "Profile save failed: "+
      errText(e)
    );
  }
}

async function adminSearchUsers(){

  if(
    state.profile?.is_admin!==true
  ){

    return toast(
      "Admin access denied."
    );
  }

  const input=
    document.getElementById(
      "adminUserSearch"
    );

  const results=
    document.getElementById(
      "adminResults"
    );

  if(!results){
    return;
  }

  const q=
    input?.value.trim();

  results.innerHTML=
    `
      <div class="empty">
        Loading users…
      </div>
    `;

  try{

    let query=
      sb
        .from("profiles")
        .select("*")
        .limit(30);

    if(q){

      const [
        byName,
        byUsername
      ]=await Promise.all([

        sb
          .from("profiles")
          .select("*")
          .ilike(
            "display_name",
            `%${q}%`
          )
          .limit(30),

        sb
          .from("profiles")
          .select("*")
          .ilike(
            "username",
            `%${q}%`
          )
          .limit(30)

      ]);

      if(
        byName.error ||
        byUsername.error
      ){

        throw (
          byName.error ||
          byUsername.error
        );
      }

      const map=
        new Map();

      [
        ...(byName.data || []),
        ...(byUsername.data || [])
      ]
      .forEach(
        user=>
          map.set(
            user.id,
            user
          )
      );

      renderAdminResults(
        [...map.values()]
      );

      return;
    }

    const {
      data,
      error
    }=await query;

    if(error){
      throw error;
    }

    renderAdminResults(
      data || []
    );

  }catch(e){

    results.innerHTML=
      `
        <div class="aiError">
          Admin search failed:
          ${esc(
            errText(e)
          )}
        </div>
      `;
  }
}

let locationWatcher=null;


async function toggleLocation(){

  if(!navigator.geolocation){

    return toast(
      "This device/browser does not support GPS."
    );
  }

  if(locationWatcher!==null){

    navigator.geolocation.clearWatch(
      locationWatcher
    );

    locationWatcher=null;

    await saveLocation(
      null,
      null,
      false
    );

    toast(
      "Location sharing stopped."
    );

    if(state.tab==="map"){
      renderApp();
    }

    return;
  }

  toast(
    "Requesting location permission…"
  );

  locationWatcher=
    navigator.geolocation.watchPosition(
      async position=>{

        const latitude=
          position.coords.latitude;

        const longitude=
          position.coords.longitude;

        const accuracy=
          position.coords.accuracy;

        await saveLocation(
          latitude,
          longitude,
          true,
          accuracy
        );

        const pin=
          document.getElementById(
            "userPin"
          );

        const coordinates=
          document.getElementById(
            "coordinates"
          );

        const status=
          document.getElementById(
            "locationStatus"
          );

        if(pin){

          pin.style.display="block";

          /*
           * This small visual map is intentionally
           * not pretending to be Google Maps.
           * Real coordinates are saved to Supabase.
           */
          pin.style.left="50%";
          pin.style.top="50%";
        }

        if(coordinates){

          coordinates.textContent=
            `${latitude.toFixed(6)}, ${longitude.toFixed(6)}
             · ±${Math.round(accuracy || 0)}m`;
        }

        if(status){

          status.textContent=
            "Location sharing is active.";
        }

      },

      error=>{

        locationWatcher=null;

        let message=
          "Could not get your location.";

        if(error.code===1){

          message=
            "Location permission was denied. Allow location access in your browser settings.";

        }else if(error.code===2){

          message=
            "Your device could not determine a location.";

        }else if(error.code===3){

          message=
            "Location request timed out.";
        }

        toast(message);

      },

      {
        enableHighAccuracy:true,
        maximumAge:10000,
        timeout:20000
      }
    );
}


async function saveLocation(
  latitude,
  longitude,
  isSharing,
  accuracy=null
){

  if(!state.user?.id){
    return;
  }

  /*
   * If your locations table uses different column names,
   * the database schema must match these fields.
   */

  const payload={
    user_id:state.user.id,
    latitude,
    longitude,
    accuracy,
    is_sharing:isSharing,
    updated_at:new Date().toISOString()
  };

  const {
    error
  }=await sb
    .from("locations")
    .upsert(
      payload,
      {
        onConflict:"user_id"
      }
    );

  if(error){

    console.error(
      "Location database error:",
      error
    );

    toast(
      "Location database error: "+
      errText(error)
    );
  }
}

async function createCircle(){

  const name=
    document
      .getElementById("circleName")
      ?.value.trim();

  const description=
    document
      .getElementById("circleDescription")
      ?.value.trim();

  if(!name){

    return toast(
      "Enter a circle name."
    );
  }

  try{

    const code=
      "TC-"+randomCode(6);

    const {
      data:circle,
      error
    }=await sb
      .from("circles")
      .insert({
        name,
        description:
          description || null,
        invite_code:code,
        owner_id:state.user.id
      })
      .select("*")
      .single();

    if(error){
      throw error;
    }

    /*
     * IMPORTANT:
     * We do NOT query circle_members here to determine
     * membership. That avoids triggering recursive RLS
     * policies on circle_members.
     */

    const {
      error:memberError
    }=await sb
      .from("circle_members")
      .insert({
        circle_id:circle.id,
        user_id:state.user.id,
        role:"owner"
      });

    if(memberError){

      /*
       * The circle was created but membership failed.
       * Do not pretend it succeeded.
       */

      throw memberError;
    }

    closeModal(
      "circleCreateModal"
    );

    await loadCircles();
    await loadStats();

    renderApp();

    showCircleCode(
      circle.invite_code
    );

  }catch(e){

    toast(
      "Circle creation failed: "+
      errText(e)
    );
  }
}

        );

    closeModal(
      "circleJoinModal"
    );

    await loadCircles();
    await loadStats();

      `Joined ${circle.name}.`
    );

      errText(e)
    );
  }

function randomCode(length){

  const chars=
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result="";

  for(
    let i=0;
    i<length;
    i++
  ){

    result+=
      chars[
        Math.floor(
          Math.random()*
          chars.length
        )
      ];
  }

  return result;
}

async function searchPeople(){

  const query=
    document
      .getElementById("peopleQuery")
      ?.value
      .trim();

  const container=
    document.getElementById(
      "searchResults"
    );

  if(!query){

    if(container){

      container.innerHTML=
        `
          <div class="empty">
            Type a name or username.
          </div>
        `;
    }

    return;
  }

  if(container){

    container.innerHTML=
      `
        <div class="empty">
          Searching…
        </div>
      `;
  }

  const {
    data,
    error
  }=await sb
    .from("profiles")
    .select("*")
    .or(
      `display_name.ilike.%${escapeFilter(query)}%,username.ilike.%${escapeFilter(query)}%`
    )
    .neq(
      "id",
      state.user.id
    )
    .limit(20);

  if(error){

    if(container){

      container.innerHTML=
        `
          <div class="empty">
            Search failed.
            <br><br>
            ${esc(errText(error))}
          </div>
        `;
    }

    return;
  }

  if(!data?.length){

    if(container){

      container.innerHTML=
        `
          <div class="empty">
            No Track Circle users found.
          </div>
        `;
    }

    return;
  }

  const statuses=
    await Promise.all(
      data.map(
        p=>
          getFriendStatus(
            p.id
          )
      )
    );

  if(container){

    container.innerHTML=
      data
        .map(
          (p,i)=>
          personCard(
            p,
            statuses[i]
          )
        )
        .join("");
  }
}


function escapeFilter(value){

  return value
    .replace(/[%_]/g,"\\$&")
    .replace(/,/g,"\\,");
}


async function getFriendStatus(id){

  /*
   * The friendships table should have:
   * requester_id, addressee_id, status
   *
   * We deliberately query both directions so the UI
   * works whether the user sent or received the request.
   */

  const {
    data,
    error
  }=await sb
    .from("friendships")
    .select(
      "id,requester_id,addressee_id,status"
    )
    .or(
      `and(requester_id.eq.${state.user.id},addressee_id.eq.${id}),and(requester_id.eq.${id},addressee_id.eq.${state.user.id})`
    )
    .limit(1);

  if(error){

    console.error(
      "Friend status error:",
      error
    );

    return {
      status:"error",
      message:errText(error)
    };
  }

  if(!data?.length){

    return {
      status:"none"
    };
  }

  const relationship=
    data[0];

  return {
    ...relationship,
    direction:
      relationship.requester_id===
      state.user.id
        ? "sent"
        : "received"
  };
}


function personCard(
  profile,
  relationship
){

  let action="Add friend";
  let disabled=false;

  if(
    relationship.status==="accepted"
  ){

    action="Friends";
    disabled=true;

  }else if(
    relationship.status==="pending" &&
    relationship.direction==="sent"
  ){

    action="Request sent";
    disabled=true;

  }else if(
    relationship.status==="pending" &&
    relationship.direction==="received"
  ){

    action="Accept";

  }else if(
    relationship.status==="error"
  ){

    action="Unavailable";
    disabled=true;
  }

  return `
    <div class="listitem">

      ${avatar(profile)}

      <div class="grow">

        <b>
          ${esc(
            profile.display_name ||
            profile.username ||
            "Track Circle user"
          )}

          ${verifiedBadge(profile)}
        </b>

        <div class="muted small">
          @${esc(
            profile.username ||
            "user"
          )}
        </div>

      </div>

      <button
        class="btn secondary"
        ${disabled?"disabled":""}
        onclick="${
          relationship.status==="pending" &&
          relationship.direction==="received"
            ?
          `acceptFriend('${relationship.id}')`
            :
          `sendFriendRequest('${profile.id}')`
        }"
      >
        ${action}
      </button>

    </div>
  `;
}


async function sendFriendRequest(id){

  if(id===state.user.id){
    return;
  }

  const existing=
    await getFriendStatus(id);

  if(
    existing.status!=="none"
  ){

    if(existing.status==="error"){

      return toast(
        "Friend status could not be loaded: "+
        existing.message
      );
    }

    return toast(
      "There is already a friendship request."
    );
  }

  const {
    error
  }=await sb
    .from("friendships")
    .insert({
      requester_id:state.user.id,
      addressee_id:id,
      status:"pending"
    });

  if(error){

    return toast(
      "Friend request failed: "+
      errText(error)
    );
  }

  toast(
    "Friend request sent."
  );

  await searchPeople();
}

async function loadMessages(){

  if(!state.user?.id){
    return;
  }

  const friendContainer=
    document.getElementById(
      "friendList"
    );

  if(friendContainer){

    friendContainer.innerHTML=
      `
        <div class="empty">
          Loading friends…
        </div>
      `;
  }

  const {
    data,
    error
  }=await sb
    .from("friendships")
    .select(
      "id,requester_id,addressee_id,status"
    )
    .eq(
      "status",
      "accepted"
    )
    .or(
      `requester_id.eq.${state.user.id},addressee_id.eq.${state.user.id}`
    );

  if(error){

    if(friendContainer){

      friendContainer.innerHTML=
        `
          <div class="empty">
            Friend list unavailable.
            <br><br>
            ${esc(errText(error))}
          </div>
        `;
    }

    return;
  }

  const friendIds=
    (data || [])
      .map(
        relationship=>
          relationship.requester_id===
          state.user.id
            ?
          relationship.addressee_id
            :
          relationship.requester_id
      );

  if(!friendIds.length){

    if(friendContainer){

      friendContainer.innerHTML=
        `
          <div class="empty">
            You don't have accepted friends yet.
            Use the search above to find people.
          </div>
        `;
    }

    return;
  }

  const {
    data:friends
  }=await sb
    .from("profiles")
    .select("*")
    .in(
      "id",
      friendIds
    );

  if(friendContainer){

    friendContainer.innerHTML=
      (friends || [])
        .map(
          friend=>
          `
            <div class="listitem">

              ${avatar(friend)}

              <div class="grow">

                <b>
                  ${esc(
                    friend.display_name ||
                    friend.username ||
                    "Friend"
                  )}

                  ${verifiedBadge(friend)}
                </b>

                <div class="muted small">
                  @${esc(
                    friend.username ||
                    "user"
                  )}
                </div>

              </div>

              <button
                class="btn"
                onclick="openChat('${friend.id}')"
              >
                Message
              </button>

            </div>
          `
        )
        .join("");
  }
}

async function loadPrivateChat(friendId){

  const box=
    document.getElementById(
      "privateChat"
    );

  const {
    data,
    error
  }=await sb
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${state.user.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${state.user.id})`
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    )
    .limit(100);

  if(error){

    if(box){

      box.innerHTML=
        `
          <div class="empty">
            Messages unavailable.
            <br><br>
            ${esc(errText(error))}
          </div>
        `;
    }

    return;
  }

  if(box){

    box.innerHTML=
      data?.length
        ?
      data
        .map(
          message=>
          `
            <div
              class="bubble ${
                message.sender_id===
                state.user.id
                  ? "me"
                  : ""
              }"
            >
              ${esc(
                message.content ||
                ""
              )}

              <div
                class="muted"
                style="
                  font-size:9px;
                  margin-top:5px
                "
              >
                ${fmtDate(
                  message.created_at
                )}
              </div>

            </div>
          `
        )
        .join("")
        :
      `
        <div class="empty">
          No messages yet. Say hello.
        </div>
      `;

    box.scrollTop=
      box.scrollHeight;
  }
}


async function sendMessage(friendId){

  const content=
    input?.value.trim();

  if(!content){
    return;

  const {
    error
  }=await sb
    .from("messages")
    .insert({
      sender_id:state.user.id,
      receiver_id:friendId,
      content
    });

  if(error){

    return toast(
      "Message failed: "+
      errText(error)
    );
  }

  input.value="";

  await loadPrivateChat(
    friendId
  );
}

async function saveProfile(){

  const display_name=
    document
      .getElementById(
        "profileNameInput"
      )
      ?.value.trim();

  const username=
    document
      .getElementById(
        "profileUsernameInput"
      )
      ?.value.trim()
      .toLowerCase()
      .replace(
        /[^a-z0-9_]/g,
        ""
      );

  const bio=
    document
      .getElementById(
        "profileBioInput"
      )
      ?.value.trim();

  const file=
    document
      .getElementById(
        "profilePhoto"
      )
      ?.files?.[0];

  if(!display_name){

    return toast(
      "Display name is required."
    );
  }

  try{

    let avatar_url=
      state.profile?.avatar_url ||
      null;

    if(file){

      avatar_url=
        await uploadFile(
          file,
          "avatars"
        );
    }

    const {
      data,
      error
    }=await sb
      .from("profiles")
      .update({
        display_name,
        username:
          username || null,
        bio:
          bio || null,
        avatar_url
      })
      .eq(
        "id",
        state.user.id
      )
      .select("*")
      .single();

    if(error){
      throw error;
    }

    state.profile=data;

    state.profiles=
      state.profiles.map(
        p=>
          p.id===data.id
            ? data
            : p
      );

    toast(
      "Profile saved."
    );

    renderApp();

  }catch(e){

    toast(
      "Profile save failed: "+
      errText(e)
    );
  }
}

      container.innerHTML=
        `
          <div class="empty">
            ${esc(errText(error))}
          </div>
        `;
    }

    return;
  }

  if(container){

    container.innerHTML=
      data?.length
        ?
      data
        .map(
          p=>
          `
            <div class="listitem">

              ${avatar(p)}

              <div class="grow">

                <b>
                  ${esc(
                    p.display_name ||
                    p.username ||
                    "User"
                  )}

                  ${verifiedBadge(p)}
                </b>

                <div class="muted small">
                  @${esc(
                    p.username ||
                    "user"
                  )}
                </div>

              </div>

              <button
                class="btn ${
                  p.is_verified
                    ? "danger"
                    : ""
                }"
                onclick="setVerification('${p.id}',${!p.is_verified})"
              >
                ${
                  p.is_verified
                    ? "Remove"
                    : "Verify"
                }
              </button>

            </div>
          `
        )
        .join("")
        :
      `
        <div class="empty">
          No users found.
        </div>
      `;
  }
}


async function setVerification(
  userId,
  verified
){

  if(!state.profile?.is_admin){

    return toast(
      "Administrator access required."
    );
  }

  const {
    error
  }=await sb
    .from("profiles")
    .update({
      is_verified:verified
    })
    .eq(
      "id",
      userId
    );

  if(error){

    return toast(
      "Verification update failed: "+
      errText(error)
    );
  }

  toast(
    verified
      ? "User verified."
      : "Verification removed."
  );

  await loadProfiles();

  await adminSearchUsers();
}


function messagesShortcut(){

  go("messages");
}


async function sharePost(postId){

  const post=
    state.posts.find(
      p=>p.id===postId
    );

  if(!post){
    return;
  }

  const url=
    post.media_url ||
    location.href;

  try{

    if(
      navigator.share
    ){

      await navigator.share({
        title:"Track Circle",
        text:
          post.caption ||
          "Check this Track Circle post.",
        url
      });

    }else{

      await navigator.clipboard.writeText(
        url
      );

      toast(
        "Post link copied."
      );
    }

  }catch(e){

    if(
      e?.name!=="AbortError"
    ){

      toast(
        "Could not share this post."
      );
    }
  }
}


/*
 * Close a modal when the dark background itself
 * is tapped.
 */
document.addEventListener(
  "click",
  event=>{

    const modal=
      event.target.closest(
        ".modal"
      );

    if(
      modal &&
      event.target===modal
    ){

      modal.remove();
    }
  }
);


/*
 * Keep Track AI available even if a render
 * happens while another request is running.
 */
window.addEventListener(
  "online",
  ()=>{
    if(
      state.tab==="ai"
    ){
      toast(
        "Connection restored."
      );
    }
  }
);


/*
 * Prevent accidental page refresh from
 * submitting forms if this file is extended
 * later with a form element.
 */
document.addEventListener(
  "submit",
  event=>{
    event.preventDefault();
  }
);


/*
 * Start the application.
 */
boot();

</script>
