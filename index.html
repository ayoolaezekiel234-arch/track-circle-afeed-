<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
  name="theme-color"
  content="#080b10"
>

<meta
  name="description"
  content="Track Circle — Stay Connected. Stay Close."
>

<title>Track Circle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#080b10;
  --bg2:#0b1017;
  --card:#10161e;
  --card2:#121a23;
  --green:#19e6a0;
  --green2:#10c989;
  --white:#ffffff;
  --text:#f5f7f8;
  --muted:#8c98a5;
  --line:rgba(255,255,255,.08);
  --danger:#ff5263;
  --yellow:#ffd45c;
  --blue:#4ca7ff;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

input,
textarea,
select{
  outline:none;
}

img{
  max-width:100%;
  display:block;
}

.hidden{
  display:none !important;
}

.muted{
  color:var(--muted);
}

.green{
  color:var(--green);
}

.red{
  color:var(--danger);
}


/* =========================================================
   APP SHELL
   ========================================================= */

#app{
  width:100%;
  min-height:100vh;
  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(25,230,160,.10),
      transparent 28%
    ),
    radial-gradient(
      circle at 100% 15%,
      rgba(55,130,255,.08),
      transparent 30%
    ),
    var(--bg);
}

.appShell{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:0 auto;
  position:relative;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.015),
      transparent 25%
    );
}

.content{
  width:100%;
  min-height:100vh;
  padding:
    20px
    20px
    105px
    20px;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topBar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:24px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brandLogo{
  width:42px;
  height:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle,
      rgba(25,230,160,.35),
      rgba(25,230,160,.08) 55%,
      rgba(25,230,160,.02)
    );
  border:1px solid rgba(25,230,160,.35);
  box-shadow:
    0 0 25px rgba(25,230,160,.18);
  color:var(--green);
  font-weight:900;
  font-size:18px;
}

.brandText strong{
  display:block;
  font-size:15px;
  letter-spacing:.4px;
}

.brandText span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.profileButton{
  width:42px;
  height:42px;
  border-radius:50%;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.profileButton img{
  width:100%;
  height:100%;
  object-fit:cover;
}


/* =========================================================
   PAGES
   ========================================================= */

.page{
  display:none;
  animation:pageIn .25s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* =========================================================
   HERO
   ========================================================= */

.hero{
  position:relative;
  overflow:hidden;
  min-height:210px;
  padding:25px;
  border-radius:28px;
  border:1px solid rgba(25,230,160,.15);
  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(25,230,160,.25),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(40,110,255,.14),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #101a1c,
      #0d1219 55%,
      #091017
    );
  box-shadow:var(--shadow);
}

.hero:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-70px;
  top:-80px;
  border-radius:50%;
  border:1px solid rgba(25,230,160,.15);
  box-shadow:
    0 0 50px rgba(25,230,160,.12);
}

.hero:after{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  right:25px;
  top:35px;
  border-radius:50%;
  border:1px dashed rgba(25,230,160,.18);
}

.heroSmall{
  color:var(--green);
  font-size:11px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:9px;
}

.hero h1{
  font-size:30px;
  line-height:1.05;
  letter-spacing:-1px;
  max-width:310px;
}

.hero p{
  color:var(--muted);
  margin-top:12px;
  line-height:1.55;
  font-size:13px;
  max-width:330px;
}

.heroActions{
  display:flex;
  gap:9px;
  margin-top:20px;
  flex-wrap:wrap;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.primaryBtn{
  min-height:44px;
  padding:0 17px;
  border-radius:14px;
  background:var(--green);
  color:#03130d;
  font-weight:800;
  box-shadow:
    0 8px 25px rgba(25,230,160,.15);
}

.primaryBtn:active{
  transform:scale(.98);
}

.secondaryBtn{
  min-height:44px;
  padding:0 17px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:var(--text);
  font-weight:700;
}

.dangerBtn{
  min-height:44px;
  padding:0 17px;
  border-radius:14px;
  background:rgba(255,82,99,.1);
  border:1px solid rgba(255,82,99,.2);
  color:#ff8290;
  font-weight:700;
}


/* =========================================================
   SECTION
   ========================================================= */

.section{
  margin-top:25px;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.sectionHead h2{
  font-size:17px;
}

.sectionHead button{
  background:none;
  color:var(--green);
  font-size:12px;
  font-weight:700;
}


/* =========================================================
   CARDS
   ========================================================= */

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.015)
    ),
    var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  box-shadow:0 12px 40px rgba(0,0,0,.16);
}

.card + .card{
  margin-top:10px;
}


/* =========================================================
   LIVE LOCATION CARD
   ========================================================= */

.locationCard{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.locationLeft{
  display:flex;
  align-items:center;
  gap:13px;
}

.locationIcon{
  width:45px;
  height:45px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(25,230,160,.08);
  border:1px solid rgba(25,230,160,.16);
  color:var(--green);
  font-size:20px;
}

.locationText strong{
  display:block;
  font-size:14px;
}

.locationText span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.switch{
  width:50px;
  height:29px;
  padding:3px;
  border-radius:20px;
  background:#252c34;
  border:1px solid var(--line);
  transition:.2s;
}

.switch i{
  display:block;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#8a949d;
  transition:.2s;
}

.switch.on{
  background:rgba(25,230,160,.25);
  border-color:rgba(25,230,160,.4);
}

.switch.on i{
  transform:translateX(20px);
  background:var(--green);
  box-shadow:0 0 15px rgba(25,230,160,.5);
}


/* =========================================================
   MINI MAP
   ========================================================= */

.miniMap{
  position:relative;
  height:190px;
  overflow:hidden;
  border-radius:20px;
  border:1px solid var(--line);
  background:
    linear-gradient(
      135deg,
      rgba(16,34,37,.9),
      rgba(8,16,23,.98)
    );
}

.miniMap:before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    repeating-linear-gradient(
      30deg,
      transparent 0 35px,
      rgba(255,255,255,.035) 36px 37px
    );
  transform:rotate(-8deg);
}

.mapRoad{
  position:absolute;
  height:2px;
  background:rgba(255,255,255,.08);
  transform-origin:left center;
}

.road1{
  width:130%;
  left:-10%;
  top:42%;
  transform:rotate(14deg);
}

.road2{
  width:100%;
  left:8%;
  top:65%;
  transform:rotate(-25deg);
}

.road3{
  width:90%;
  left:20%;
  top:20%;
  transform:rotate(45deg);
}

.mapPulse{
  position:absolute;
  left:50%;
  top:50%;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--green);
  transform:translate(-50%,-50%);
  box-shadow:
    0 0 0 8px rgba(25,230,160,.12),
    0 0 30px rgba(25,230,160,.8);
}

.mapPulse:after{
  content:"";
  position:absolute;
  inset:-25px;
  border:1px solid rgba(25,230,160,.25);
  border-radius:50%;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{
    transform:scale(.6);
    opacity:.8;
  }
  100%{
    transform:scale(1.7);
    opacity:0;
  }
}

.mapLabel{
  position:absolute;
  left:14px;
  top:14px;
  padding:7px 10px;
  border-radius:10px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  font-size:10px;
  color:var(--muted);
}


/* =========================================================
   CIRCLE CARDS
   ========================================================= */

.circleCard{
  padding:16px;
  border-radius:19px;
  background:var(--card);
  border:1px solid var(--line);
}

.circleCard + .circleCard{
  margin-top:10px;
}

.circleTop{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.circleName{
  font-size:15px;
  font-weight:800;
}

.circleType{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.liveBadge{
  color:var(--green);
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.avatarStack{
  display:flex;
  margin-top:13px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      135deg,
      rgba(25,230,160,.2),
      rgba(25,230,160,.05)
    );
  border:2px solid var(--card);
  color:var(--green);
  font-size:11px;
  font-weight:800;
  overflow:hidden;
  margin-left:-6px;
}

.avatar:first-child{
  margin-left:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.inviteLine{
  margin-top:10px;
  color:var(--muted);
  font-size:11px;
}

.inviteLine strong{
  color:var(--white);
}


/* =========================================================
   SEARCH
   ========================================================= */

.searchBox{
  position:relative;
  margin-bottom:13px;
}

.searchBox input{
  width:100%;
  height:48px;
  border-radius:15px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--white);
  padding:0 15px;
}

.searchBox input:focus{
  border-color:rgba(25,230,160,.4);
  box-shadow:0 0 0 3px rgba(25,230,160,.06);
}


/* =========================================================
   USER RESULT
   ========================================================= */

.userResult{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  margin-bottom:9px;
}

.userInfo{
  flex:1;
  min-width:0;
}

.userInfo b{
  font-size:13px;
}

.userInfo .muted{
  font-size:11px;
  margin-top:3px;
}

.addBtn{
  min-height:35px;
  padding:0 13px;
  border-radius:11px;
  background:rgba(25,230,160,.1);
  border:1px solid rgba(25,230,160,.2);
  color:var(--green);
  font-weight:800;
  font-size:11px;
}


/* =========================================================
   CHAT
   ========================================================= */

.chat{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-radius:17px;
  background:var(--card);
  border:1px solid var(--line);
  margin-bottom:9px;
}

.chatAvatar{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(25,230,160,.09);
  border:1px solid rgba(25,230,160,.18);
  color:var(--green);
  font-weight:900;
  overflow:hidden;
}

.chatAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.chatInfo{
  flex:1;
  min-width:0;
}

.chatName{
  font-size:13px;
  font-weight:800;
}

.chatPreview{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}


/* =========================================================
   AI
   ========================================================= */

.aiShell{
  border-radius:23px;
  border:1px solid rgba(25,230,160,.14);
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(25,230,160,.10),
      transparent 35%
    ),
    var(--card);
  overflow:hidden;
}

.aiHeader{
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
}

.aiLogo{
  width:43px;
  height:43px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-weight:900;
  background:rgba(25,230,160,.08);
  border:1px solid rgba(25,230,160,.2);
  box-shadow:0 0 25px rgba(25,230,160,.1);
}

.aiHeader strong{
  display:block;
}

.aiHeader span{
  color:var(--muted);
  font-size:10px;
}

.aiMessages{
  height:430px;
  overflow-y:auto;
  padding:17px;
}

.aiMsg{
  max-width:88%;
  padding:12px 14px;
  border-radius:16px;
  background:#161e27;
  border:1px solid var(--line);
  margin-bottom:10px;
  font-size:13px;
  line-height:1.55;
}

.aiMsg.user{
  margin-left:auto;
  background:rgba(25,230,160,.12);
  border-color:rgba(25,230,160,.16);
}

.aiInputRow{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--line);
}

.aiInputRow input{
  flex:1;
  min-width:0;
  height:46px;
  border-radius:14px;
  background:#080d12;
  border:1px solid var(--line);
  color:white;
  padding:0 13px;
}

.aiSend{
  width:46px;
  height:46px;
  border-radius:14px;
  background:var(--green);
  color:#03130d;
  font-weight:900;
}

.suggestions{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:0 13px 13px;
}

.suggestions button{
  white-space:nowrap;
  border-radius:12px;
  padding:8px 11px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:10px;
}


/* =========================================================
   POSTS
   ========================================================= */

.postComposer{
  padding:15px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
}

.postComposer textarea{
  width:100%;
  min-height:90px;
  resize:none;
  background:transparent;
  color:white;
  border:0;
  line-height:1.5;
}

.composerBottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.mediaButtons{
  display:flex;
  gap:6px;
}

.mediaButtons button{
  width:35px;
  height:35px;
  border-radius:11px;
  background:rgba(255,255,255,.05);
  color:var(--muted);
}

.post{
  margin-top:11px;
  padding:16px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
}

.postHead{
  display:flex;
  align-items:center;
  gap:10px;
}

.postUserAvatar{
  width:39px;
  height:39px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:rgba(25,230,160,.09);
  color:var(--green);
  font-weight:900;
}

.postUserAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.postName{
  font-size:12px;
  font-weight:800;
}

.postTime{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

.postText{
  margin-top:14px;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:14px;
  padding-top:11px;
  border-top:1px solid var(--line);
  overflow-x:auto;
}

.actions button{
  flex:0 0 auto;
  padding:7px 9px;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  color:var(--muted);
  font-size:10px;
}


/* =========================================================
   PROFILE
   ========================================================= */

.profileHero{
  text-align:center;
  padding:25px 17px;
}

.profilePic{
  width:90px;
  height:90px;
  margin:0 auto 13px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(
      circle,
      rgba(25,230,160,.18),
      rgba(25,230,160,.04)
    );
  border:2px solid rgba(25,230,160,.25);
  color:var(--green);
  font-size:28px;
  font-weight:900;
  box-shadow:
    0 0 30px rgba(25,230,160,.12);
}

.profilePic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profileHero h2{
  font-size:20px;
}

.profileHero p{
  color:var(--muted);
  margin-top:4px;
  font-size:12px;
}

.profileActions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:15px;
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.nav{
  position:fixed;
  z-index:100;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  padding:
    9px
    12px
    calc(9px + env(safe-area-inset-bottom));
  background:
    rgba(8,11,16,.88);
  border-top:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
}

.navInner{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.nav button{
  min-height:55px;
  border-radius:15px;
  background:transparent;
  color:#69747e;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:9px;
}

.nav button span:first-child{
  font-size:19px;
  line-height:1;
}

.nav button.active{
  color:var(--green);
  background:rgba(25,230,160,.08);
}


/* =========================================================
   MODAL
   ========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(520px,100%);
  max-height:90vh;
  overflow-y:auto;
  padding:20px;
  border-radius:27px 27px 0 0;
  background:#10161e;
  border:1px solid var(--line);
  box-shadow:0 -20px 60px rgba(0,0,0,.5);
}

async function submitAuth(){

 const name =
  document.getElementById("authName")
   ?.value
   .trim();

 const username =
  document.getElementById("authUsername")
   ?.value
   .trim()
   .replace(/^@/,"")
   .toLowerCase();

 const email =
  document.getElementById("authEmail")
   ?.value
   .trim();

 const password =
  document.getElementById("authPassword")
   ?.value;

 const errorBox =
  document.getElementById("authError");

 const button =
  document.getElementById("authButton");

 if(errorBox)
  errorBox.textContent="";

 if(!supabaseClient){

  if(errorBox)
   errorBox.textContent=
    "Supabase is not connected.";

  return;
 }

 if(!email){

  if(errorBox)
   errorBox.textContent=
    "Enter your email address.";

  return;
 }

 if(!password || password.length<6){

  if(errorBox)
   errorBox.textContent=
    "Password must contain at least 6 characters.";

  return;
 }

 if(
  currentAuthMode==="signup" &&
  !name
 ){

  if(errorBox)
   errorBox.textContent=
    "Enter your full name.";

  return;
 }

 if(
  currentAuthMode==="signup" &&
  !username
 ){

  if(errorBox)
   errorBox.textContent=
    "Choose a username.";

  return;
 }

 try{

  if(button){

   button.disabled=true;

   button.textContent=
    currentAuthMode==="signup"
     ? "Creating account..."
     : "Signing in...";

  }


  if(currentAuthMode==="signup"){

   const result =
    await supabaseClient.auth.signUp({

     email:email,

     password:password,

     options:{
      data:{
       display_name:name,
       username:username
      }
     }

    });

   if(result.error)
    throw result.error;

   if(result.data?.session){

    currentUser =
     result.data.session.user;

    await createOrUpdateProfile({
     id:currentUser.id,
     display_name:name,
     username:username
    });

    await loadCurrentProfile();

    showMain();

    await loadAppData();

    toast(
     "Account created successfully."
    );

   }else{

    showAuth();

    if(errorBox){

     errorBox.style.color=
      "var(--green)";

     errorBox.textContent=
      "Account created. Check your email if confirmation is required.";

    }

   }

  }else{

   const result =
    await supabaseClient.auth.signInWithPassword({

     email:email,

     password:password

    });

   if(result.error)
    throw result.error;

   if(!result.data?.session)
    throw new Error(
     "No active session was created."
    );

   currentUser =
    result.data.session.user;

   await loadCurrentProfile();

   showMain();

   await loadAppData();

   toast(
    "Welcome back."
   );

  }

 }catch(error){

  console.error(
   "Authentication error:",
   error
  );

  if(errorBox){

   errorBox.style.color=
    "var(--red)";

   errorBox.textContent=
    error.message ||
    "Authentication failed.";

  }

 }finally{

  if(button){

   button.disabled=false;

   button.textContent=
    currentAuthMode==="signup"
     ? "Create account"
     : "Sign in";

  }

 }

}

/* =========================================================
   LOCATION
   ========================================================= */

function toggleLocation(){

 if(locationEnabled)
  stopLocation();
 else
  startLocation();

}


function startLocation(){

 if(!navigator.geolocation){

  toast(
   "Location is not supported on this device."
  );

  return;
 }

 navigator.geolocation.getCurrentPosition(

  position=>{

   locationEnabled=true;

   updateLocationUI();

   updateOwnLocation(
    position.coords.latitude,
    position.coords.longitude
   );

   locationWatcher =
    navigator.geolocation.watchPosition(

     pos=>{

      updateOwnLocation(
       pos.coords.latitude,
       pos.coords.longitude
      );

     },

     error=>{

      console.warn(
       "Location watcher:",
       error
      );

     },

     {
      enableHighAccuracy:true,
      maximumAge:10000,
      timeout:15000
     }

    );

   toast(
    "Location sharing is ON."
   );

  },

  error=>{

   console.warn(
    "Location permission:",
    error
   );

   toast(
    "Allow location permission to enable sharing."
   );

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }

 );

}


function stopLocation(){

 if(
  locationWatcher !== null &&
  navigator.geolocation
 ){

  navigator.geolocation.clearWatch(
   locationWatcher
  );

 }

 locationWatcher=null;
 locationEnabled=false;

 updateLocationUI();

 toast(
  "Location sharing is OFF."
 );

}


function updateLocationUI(){

 const status =
  document.getElementById(
   "locationStatus"
  );

 const toggle =
  document.getElementById(
   "locationSwitch"
  );

 if(status){

  status.textContent =
   locationEnabled
    ? "Location sharing is ON"
    : "Location is off";

 }

 if(toggle){

  toggle.classList.toggle(
   "on",
   locationEnabled
  );

 }

}

let toastTimer=null;

function toast(message){

 const element =
  document.getElementById(
   "toast"
  );

 if(!element)
  return;

 element.textContent =
  String(message || "");

 element.classList.add(
  "show"
 );

 );

  setTimeout(()=>{

   element.classList.remove(
    "show"
   );

}


/* =========================================================
   UTILITY FUNCTIONS
   ========================================================= */

function escapeHtml(value){

 return String(
  value ?? ""
 )
  .replaceAll(
   "&",
   "&amp;"
  )
  .replaceAll(
   "<",
   "&lt;"
  )
  .replaceAll(
   ">",
   "&gt;"
  )
  .replaceAll(
   '"',
   "&quot;"
  )
  .replaceAll(
   "'",
   "&#039;"
  );

}


function escapeAttr(value){

 return escapeHtml(
  value
 );

}


function formatDate(value){

 if(!value)
  return "";

 try{

  return new Date(
   value
  ).toLocaleString();

 }catch(error){

  return "";

 }

}

async function sendAI(){

 const input =

   "aiInput"

 if(!input || !box)
  return;

  return;

 box.innerHTML +=
  `<div class="aiMsg user">
    ${escapeHtml(text)}
   </div>`;

 input.value="";

 box.scrollTop =
  box.scrollHeight;

 if(!supabaseClient){

  box.innerHTML +=
   `<div class="aiMsg">
     Track Circle AI is unavailable
     because Supabase is not connected.
    </div>`;

  return;
 }

 const typing =
  document.createElement(
   "div"
  );

 typing.className=
  "aiMsg";

 typing.textContent=
  "Track Circle AI is thinking...";

 box.appendChild(
  typing
 );

 box.scrollTop =
  box.scrollHeight;

 try{

  const result =
   await supabaseClient.functions.invoke(

    "track-circle-ai",

    {
     body:{
      message:text,
      history:[]
     }
    }

   );

  if(result.error)
   throw result.error;

  const data =
   result.data;

  const reply =
   data?.reply ||
   data?.response ||
   data?.message ||
   "I received your message.";

  typing.textContent =
   reply;

 }catch(error){

  console.warn(
   "Track Circle AI:",
   error
  );

  typing.textContent =
   "I couldn't reach Track Circle AI right now. Please try again.";

 }

 box.scrollTop =
  box.scrollHeight;

}

async function uploadProfilePhoto(event){

 const file =
  event.target.files?.[0];

 if(!file)
  return;

 if(
  !supabaseClient ||
  !currentUser
 ){

  toast(
   "Sign in first."
  );

  return;
 }

 try{

  const extension =
   file.name
    .split(".")
    .pop()
    .toLowerCase();

  const path =
   currentUser.id +
   "/profile." +
   extension;

  const {error:uploadError} =
   await supabaseClient.storage
    .from("avatar")
    .upload(
     path,
     file,
     {
      upsert:true,
      contentType:file.type
     }
    );

  if(uploadError)
   throw uploadError;

  const {data:urlData} =
   supabaseClient.storage
    .from("avatar")
    .getPublicUrl(
     path
    );

  const avatarUrl =
   urlData?.publicUrl;

  if(!avatarUrl)
   throw new Error(
    "Could not create image URL."
   );

  const {error:updateError} =
   await supabaseClient
    .from("profiles")
    .update({
     avatar_url:
      avatarUrl
    })
    .eq(
     "id",
     currentUser.id
    );

  if(updateError)
   throw updateError;

  if(currentProfile)
   currentProfile.avatar_url =
    avatarUrl;

  updateProfileImages(
   avatarUrl
  );

  toast(
   "Profile picture updated."
  );

 }catch(error){

  console.error(
   "Profile photo:",
   error
  );

  toast(
   error.message ||
   "Could not upload photo."
  );

 }

}

/* =========================================================
   AUTH STATE
   ========================================================= */

function setupAuthListener(){

 if(!supabaseClient)
  return;

 supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

   console.log(
    "Track Circle auth:",
    event
   );

   if(session){

    currentUser =
     session.user;

    if(
     event==="SIGNED_IN" ||
     event==="TOKEN_REFRESHED"
    ){

     await loadCurrentProfile();

     showMain();

     await loadAppData();

    }

   }else if(
    event==="SIGNED_OUT"
   ){

    currentUser=null;
    currentProfile=null;

    showAuth();

   }

  }
 );

}


/* =========================================================
   STARTUP — NO SPLASH SCREEN
   ========================================================= */

document.addEventListener(
 "DOMContentLoaded",
 async()=>{

  const connected =
   initializeSupabase();

  if(!connected){

   showAuth();

   return;

  }

  setupAuthListener();

  try{

   const {data,error} =
    await supabaseClient.auth.getSession();

   if(error)
    throw error;

   if(data?.session){

    currentUser =
     data.session.user;

    await loadCurrentProfile();

    showMain();

    await loadAppData();

   }else{

    showAuth();

   }

  }catch(error){

   console.warn(
    "Initial session:",
    error
   );

   showAuth();

  }


  /* AI ENTER KEY */

  const aiInput =
   document.getElementById(
    "aiInput"
   );

  if(aiInput){

   aiInput.addEventListener(
    "keydown",
    event=>{

     if(
      event.key==="Enter" &&
      !event.shiftKey
     ){

      event.preventDefault();

      sendAI();

     }

    }
   );

  }


  /* SEARCH ENTER / INPUT */

  const userSearch =
   document.getElementById(
    "userSearch"
   );

  if(userSearch){

   userSearch.addEventListener(
    "input",
    searchUsers
   );

  }


  /* MESSAGE ENTER */

  const messageInput =
   document.getElementById(
    "messageInput"
   );

  if(messageInput){

   messageInput.addEventListener(
    "keydown",
    event=>{

     if(
      event.key==="Enter" &&
      !event.shiftKey
     ){

      event.preventDefault();

      sendMessage();

     }

    }
   );

  }

 });
